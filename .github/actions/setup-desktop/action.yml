name: Desktop toolchains
description: Install matching native and Elegant overlay build dependencies
runs:
  using: composite
  steps:
    - name: Restore Linux graphics toolchain
      if: runner.os == 'Linux'
      id: linux-toolchain-cache
      uses: actions/cache/restore@v4
      with:
        path: ~/.cache/arcana-qt-6.8.3-layer-6.3.6-minimal-v2
        key: qt-ubuntu24-${{ runner.arch }}-6.8.3-layer6.3.6-minimal-v2
    - name: Build Linux graphics toolchain
      if: runner.os == 'Linux'
      id: linux-toolchain-build
      shell: bash
      run: bash scripts/setup-linux-qt.sh
    # 工具链成功后立即保存，避免后续桌面构建失败导致缓存丢失。
    - name: Save Linux graphics toolchain
      if: runner.os == 'Linux' && steps.linux-toolchain-build.outcome == 'success' && steps.linux-toolchain-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: ~/.cache/arcana-qt-6.8.3-layer-6.3.6-minimal-v2
        key: ${{ steps.linux-toolchain-cache.outputs.cache-primary-key }}
    - name: Install macOS graphics toolchain
      if: runner.os == 'macOS'
      shell: bash
      run: |
        brew install qtbase cmake ninja gnu-tar
        prefix="$(brew --prefix qtbase)"
        echo "CMAKE_PREFIX_PATH=$prefix" >> "$GITHUB_ENV"
        echo "QTPATHS=$prefix/bin/qtpaths" >> "$GITHUB_ENV"
        echo "QT_LICENSE_DIR=$prefix/share/qt/licenses" >> "$GITHUB_ENV"
    - name: Install Windows graphics toolchain
      if: runner.os == 'Windows' && env.GOARCH == 'amd64'
      id: msys2
      uses: msys2/setup-msys2@v2
      with:
        msystem: UCRT64
        update: true
        install: >-
          mingw-w64-ucrt-x86_64-gcc
          mingw-w64-ucrt-x86_64-cmake
          mingw-w64-ucrt-x86_64-ninja
          curl
          tar
          mingw-w64-ucrt-x86_64-python
    - name: Identify Windows graphics toolchain
      if: runner.os == 'Windows' && env.GOARCH == 'amd64'
      id: windows-toolchain
      shell: msys2 {0}
      run: |
        # 固定绝对目录供缓存与后续 Git Bash 构建共用；软件包版本覆盖 GCC 运行库 ABI。
        prefix="$(cygpath -am "$HOME/.cache/arcana-qt-6.8.3-windows-minimal-v1")"
        toolchain_id="$({ gcc --version; g++ --version; ld --version; pacman -Q | sort; } | sha256sum | cut -d ' ' -f 1)"
        echo "prefix=$prefix" >> "$GITHUB_OUTPUT"
        echo "toolchain-id=$toolchain_id" >> "$GITHUB_OUTPUT"
        echo "QT_BUILD_PREFIX=$prefix" >> "$GITHUB_ENV"
    - name: Restore Windows graphics toolchain
      if: runner.os == 'Windows' && env.GOARCH == 'amd64'
      id: windows-toolchain-cache
      uses: actions/cache/restore@v4
      with:
        path: ${{ steps.windows-toolchain.outputs.prefix }}
        key: qt-windows-ucrt64-${{ runner.arch }}-6.8.3-minimal-v1-${{ steps.windows-toolchain.outputs.toolchain-id }}-${{ hashFiles('scripts/setup-windows-qt.sh') }}
    - name: Build Windows graphics toolchain
      if: runner.os == 'Windows' && env.GOARCH == 'amd64'
      id: windows-toolchain-build
      shell: msys2 {0}
      run: bash scripts/setup-windows-qt.sh
    # 工具链成功后立即保存；不使用回退键，避免编译器更新后命中旧 ABI。
    - name: Save Windows graphics toolchain
      if: runner.os == 'Windows' && env.GOARCH == 'amd64' && steps.windows-toolchain-build.outcome == 'success' && steps.windows-toolchain-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: ${{ steps.windows-toolchain.outputs.prefix }}
        key: ${{ steps.windows-toolchain-cache.outputs.cache-primary-key }}
