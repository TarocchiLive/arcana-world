name: Desktop toolchains
description: Install matching native and Elegant overlay build dependencies
runs:
  using: composite
  steps:
    - name: Restore Linux graphics toolchain
      if: runner.os == 'Linux'
      id: linux-toolchain-cache
      uses: actions/cache/restore@v4
      with:
        path: ~/.cache/arcana-qt-6.8.3-layer-6.3.6-minimal-v2
        key: qt-ubuntu24-${{ runner.arch }}-6.8.3-layer6.3.6-minimal-v2
    - name: Build Linux graphics toolchain
      if: runner.os == 'Linux'
      id: linux-toolchain-build
      shell: bash
      run: bash scripts/setup-linux-qt.sh
    # 工具链成功后立即保存，避免后续桌面构建失败导致缓存丢失。
    - name: Save Linux graphics toolchain
      if: runner.os == 'Linux' && steps.linux-toolchain-build.outcome == 'success' && steps.linux-toolchain-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: ~/.cache/arcana-qt-6.8.3-layer-6.3.6-minimal-v2
        key: ${{ steps.linux-toolchain-cache.outputs.cache-primary-key }}
    - name: Install macOS graphics toolchain
      if: runner.os == 'macOS'
      shell: bash
      run: |
        brew install qtbase cmake ninja gnu-tar
        prefix="$(brew --prefix qtbase)"
        echo "CMAKE_PREFIX_PATH=$prefix" >> "$GITHUB_ENV"
        echo "QTPATHS=$prefix/bin/qtpaths" >> "$GITHUB_ENV"
        echo "QT_LICENSE_DIR=$prefix/share/qt/licenses" >> "$GITHUB_ENV"
    - name: Install Windows graphics toolchain
      if: runner.os == 'Windows' && env.GOARCH == 'amd64'
      id: msys2
      uses: msys2/setup-msys2@v2
      with:
        msystem: UCRT64
        update: true
        install: >-
          mingw-w64-ucrt-x86_64-gcc
          mingw-w64-ucrt-x86_64-cmake
          mingw-w64-ucrt-x86_64-ninja
          mingw-w64-ucrt-x86_64-qt6-base
    - name: Configure Windows graphics toolchain
      if: runner.os == 'Windows' && env.GOARCH == 'amd64'
      shell: bash
      env:
        MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
      run: |
        prefix="$(cygpath -m "$MSYS2_LOCATION")/ucrt64"
        echo "$prefix/bin" >> "$GITHUB_PATH"
        echo "CMAKE_PREFIX_PATH=$prefix" >> "$GITHUB_ENV"
        echo "QTPATHS=$prefix/bin/qtpaths6.exe" >> "$GITHUB_ENV"
        echo "QT_LICENSE_DIR=$prefix/share/licenses" >> "$GITHUB_ENV"
        echo 'CMAKE_GENERATOR=Ninja' >> "$GITHUB_ENV"
        echo 'CC=gcc' >> "$GITHUB_ENV"
        echo 'CXX=g++' >> "$GITHUB_ENV"
