name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Check version tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]]; then
            echo 'Expected a version tag such as v0.1.4 or v0.1.4-rc.1' >&2
            exit 1
          fi
      - run: make check

  build:
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            goos: darwin
            goarch: amd64
          - os: macos-15
            goos: darwin
            goarch: arm64
          - os: ubuntu-24.04
            goos: linux
            goarch: amd64
          - os: ubuntu-24.04-arm
            goos: linux
            goarch: arm64
          - os: windows-latest
            goos: windows
            goarch: amd64
          - os: windows-11-arm
            goos: windows
            goarch: arm64
    runs-on: ${{ matrix.os }}
    env:
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Install Wayland drawing dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwayland-dev libpango1.0-dev libcairo2-dev libasound2-dev pkg-config
      - name: Install reproducible archive tools
        if: runner.os == 'macOS'
        run: brew install gnu-tar
      - name: Build and package
        shell: bash
        run: |
          mkdir -p package/libexec dist
          suffix=
          cgo=1
          audio_cgo=0
          tags=
          tar_tool=tar
          case "$GOOS" in
            windows) suffix=.exe; cgo=0 ;;
            linux) tags=wayland; audio_cgo=1 ;;
            darwin) tar_tool=gtar ;;
          esac
          CGO_ENABLED=0 go build -trimpath -buildvcs=false \
            -ldflags="-s -w -buildid= -X main.version=${RELEASE_TAG#v}" \
            -o "package/arcana-world$suffix" ./cmd/arcana-world
          CGO_ENABLED="$cgo" go build -tags "$tags" -trimpath -buildvcs=false \
            -ldflags="-s -w -buildid=" \
            -o "package/libexec/arcana-overlay$suffix" ./cmd/arcana-overlay
          CGO_ENABLED="$audio_cgo" go build -tags tts_audio -trimpath -buildvcs=false \
            -ldflags="-s -w -buildid=" \
            -o "package/libexec/arcana-world-tts$suffix" ./cmd/arcana-world-tts
          "./package/libexec/arcana-world-tts$suffix" -help
          cp LICENSE package/
          archive="arcana-world-${GOOS}-${GOARCH}"
          if [[ "$GOOS" == windows ]]; then
            (cd package && 7z a -tzip "../dist/${archive}.zip" arcana-world.exe libexec LICENSE)
          else
            "$tar_tool" --sort=name --mtime=@0 --owner=0 --group=0 --numeric-owner \
              -C package -cf - arcana-world libexec LICENSE | gzip -n > "dist/${archive}.tar.gz"
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Generate checksums
        working-directory: dist
        run: sha256sum *.tar.gz *.zip > checksums.txt
      - name: Publish GitHub Release
        shell: bash
        run: |
          flags=(--latest)
          if [[ "$RELEASE_TAG" == *-* ]]; then
            flags=(--prerelease --latest=false)
          fi
          gh release create "$RELEASE_TAG" --verify-tag --generate-notes \
            --title "$RELEASE_TAG" --draft dist/*
          gh release edit "$RELEASE_TAG" --draft=false "${flags[@]}"
