name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Check version tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]]; then
            echo 'Expected a version tag such as v0.2.1 or v0.2.1-rc.1' >&2
            exit 1
          fi
      - run: make check

  build:
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            goos: darwin
            goarch: amd64
          - os: macos-15
            goos: darwin
            goarch: arm64
          - os: ubuntu-24.04
            goos: linux
            goarch: amd64
          - os: ubuntu-24.04-arm
            goos: linux
            goarch: arm64
          - os: windows-latest
            goos: windows
            goarch: '386'
          - os: windows-latest
            goos: windows
            goarch: amd64
          - os: windows-11-arm
            goos: windows
            goarch: arm64
    runs-on: ${{ matrix.os }}
    env:
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Install Wayland drawing dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwayland-dev libpango1.0-dev libcairo2-dev libasound2-dev pkg-config
      - name: Install reproducible archive tools
        if: runner.os == 'macOS'
        run: brew install gnu-tar
      - name: Build and package
        shell: bash
        run: |
          OUT_DIR=package VERSION="$RELEASE_TAG" bash scripts/build.sh desktop
          mkdir -p dist
          suffix=
          tar_tool=tar
          case "$GOOS" in
            windows) suffix=.exe ;;
            darwin) tar_tool=gtar ;;
          esac
          "./package/libexec/arcana-world-tts$suffix" -help
          cp LICENSE package/
          archive="arcana-world-${GOOS}-${GOARCH}"
          if [[ "$GOOS" == windows ]]; then
            (cd package && 7z a -tzip "../dist/${archive}.zip" arcana-world.exe libexec LICENSE)
          else
            "$tar_tool" --sort=name --mtime=@0 --owner=0 --group=0 --numeric-owner \
              -C package -cf - arcana-world libexec LICENSE | gzip -n > "dist/${archive}.tar.gz"
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v6
      - name: Extract release notes from changelogs
        env:
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          tag = os.environ["RELEASE_TAG"]
          repository = os.environ["RELEASE_REPOSITORY"]
          sections = []
          for language, filename in (("中文", "CHANGELOG.md"), ("English", "CHANGELOG.en.md")):
              text = Path(filename).read_text(encoding="utf-8")
              heading = re.search(r"^## \[" + re.escape(tag) + r"\][^\n]*\n", text, re.MULTILINE)
              if heading is None:
                  raise SystemExit(f"{filename}: missing release section for {tag}")
              body = text[heading.end():]
              end = re.search(r"^## |^\[v[^\]]+\]:", body, re.MULTILINE)
              if end:
                  body = body[:end.start()]
              body = body.strip()
              if not body:
                  raise SystemExit(f"{filename}: empty release section for {tag}")
              body = re.sub(r"\]\((?![a-zA-Z][a-zA-Z0-9+.-]*:|#|/)([^)]+)\)",
                            lambda match: f"](https://github.com/{repository}/blob/{tag}/{match[1]})", body)
              sections.append(f"## {language}\n\n{body}")
          Path("release-notes.txt").write_text("\n\n".join(sections) + "\n", encoding="utf-8")
          PY
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Generate checksums
        working-directory: dist
        run: sha256sum *.tar.gz *.zip > checksums.txt
      - name: Attest release artifacts
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: dist/*
      - name: Publish GitHub Release
        shell: bash
        run: |
          flags=(--latest)
          if [[ "$RELEASE_TAG" == *-* ]]; then
            flags=(--prerelease --latest=false)
          fi
          gh release create "$RELEASE_TAG" --verify-tag --notes-file release-notes.txt \
            --title "$RELEASE_TAG" --draft dist/*
          gh release edit "$RELEASE_TAG" --draft=false "${flags[@]}"
