name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Check version tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]]; then
            echo 'Expected a version tag such as v0.2.1 or v0.2.1-rc.1' >&2
            exit 1
          fi
      - run: make check

  build:
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            goos: darwin
            goarch: amd64
          - os: macos-15
            goos: darwin
            goarch: arm64
          - os: ubuntu-24.04
            goos: linux
            goarch: amd64
          - os: ubuntu-24.04-arm
            goos: linux
            goarch: arm64
          - os: windows-latest
            goos: windows
            goarch: '386'
          - os: windows-latest
            goos: windows
            goarch: amd64
          - os: windows-11-arm
            goos: windows
            goarch: arm64
    runs-on: ${{ matrix.os }}
    env:
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - uses: ./.github/actions/setup-desktop
      - name: Build and package
        shell: bash
        run: |
          target=desktop
          if [[ "$GOOS" == windows && "$GOARCH" != amd64 ]]; then target=desktop-native; fi
          OUT_DIR=package VERSION="$RELEASE_TAG" bash scripts/build.sh "$target"
          mkdir -p dist
          suffix=
          tar_tool=tar
          case "$GOOS" in
            windows) suffix=.exe ;;
            darwin) tar_tool=gtar ;;
          esac
          "./package/libexec/arcana-world-tts$suffix" -help
          cp LICENSE package/
          archive="arcana-world-${GOOS}-${GOARCH}"
          if [[ "$GOOS" == windows ]]; then
            cp docs/看我.txt package/
            (cd package && 7z a -tzip -mx=9 "../dist/${archive}.zip" arcana-world.exe arcana-world-webui.exe libexec LICENSE 看我.txt)
          else
            "$tar_tool" --sort=name --mtime=@0 --owner=0 --group=0 --numeric-owner \
              -C package -cf - arcana-world libexec LICENSE | xz -T2 -6 > "dist/${archive}.tar.xz"
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Extract release notes from changelogs
        env:
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          tag = os.environ["RELEASE_TAG"]
          repository = os.environ["RELEASE_REPOSITORY"]
          base = f"https://github.com/{repository}"
          assets = sorted(Path("dist").glob("arcana-world-*"))
          platforms = {"windows": "Windows", "linux": "Linux", "darwin": "macOS"}
          architectures = {"amd64": "x64", "arm64": "ARM64", "386": "x86 (32-bit)"}
          rows = []
          for asset in assets:
              target = asset.name.removeprefix("arcana-world-").removesuffix(".tar.xz").removesuffix(".zip")
              platform, architecture = target.split("-")
              rows.append(f"| {platforms[platform]} | {architectures[architecture]} | [{asset.name}]({base}/releases/download/{tag}/{asset.name}) |")
          sections = []
          for language, filename in (("zh", "CHANGELOG.md"), ("en", "CHANGELOG.en.md")):
              text = Path(filename).read_text(encoding="utf-8")
              heading = re.search(r"^## \[" + re.escape(tag) + r"\][^\n]*\n", text, re.MULTILINE)
              if heading is None:
                  raise SystemExit(f"{filename}: missing release section for {tag}")
              body = text[heading.end():]
              end = re.search(r"^## |^\[v[^\]]+\]:", body, re.MULTILINE)
              if end:
                  body = body[:end.start()]
              body = body.strip()
              if not body:
                  raise SystemExit(f"{filename}: empty release section for {tag}")
              body = re.sub(r"\]\((?![a-zA-Z][a-zA-Z0-9+.-]*:|#|/)([^)]+)\)",
                            lambda match: f"](https://github.com/{repository}/blob/{tag}/{match[1]})", body)
              previous = re.search(r"^## \[(v[^\]]+)\]", text[heading.end():], re.MULTILINE)
              summary, separator, changes = body.partition("\n### ")
              if body.startswith("### ") or not separator:
                  summary, changes = "", body
              else:
                  changes = "### " + changes
                  summary = summary.strip()
              changes = re.sub(r"^### (本次更新|What's changed|新增|改进|修复|Added|Changed|Improved|Fixed|Improvements|Fixes)\s*\n", "", changes, flags=re.MULTILINE)
              changes = re.sub(r"\n{3,}", "\n\n", changes).strip()
              if language == "zh":
                  download = "## 选择下载\n\n| 平台 | 架构 | 下载 |\n| --- | --- | --- |"
                  start = (
                      "请完整解压；升级时一并替换主程序和 `libexec` 目录。\n"
                      "Windows x86 / ARM64 包仅提供原生浮层；Wayland 精美浮层需要合成器支持 layer-shell。\n\n"
                      "## 快速开始\n\n"
                      "1. 下载并解压与你的系统和架构匹配的压缩包。\n"
                      "2. Windows 运行 `arcana-world.exe`；macOS / Linux 在终端运行 `./arcana-world`。\n"
                      "3. 按提示登录账号。Windows 可运行 `arcana-world-webui.exe` 打开浏览器界面；"
                      "其他平台可在设置中选择 WebUI，默认地址为 http://127.0.0.1:5273。\n"
                  )
                  updates = "## 本次更新"
                  compare = f"查看 {previous[1]} → {tag} 的完整差异" if previous else ""
              else:
                  download = "## Downloads\n\n| Platform | Architecture | Download |\n| --- | --- | --- |"
                  start = (
                      "Extract the entire archive. When upgrading, replace both the main executable and `libexec`.\n"
                      "Windows x86 / ARM64 packages provide only the native overlay; the styled overlay on Wayland requires layer-shell.\n\n"
                      "## Quick start\n\n"
                      "1. Download and extract the archive for your system and architecture.\n"
                      "2. On Windows, run `arcana-world.exe`; on macOS / Linux, run `./arcana-world` in a terminal.\n"
                      "3. Follow the prompts to sign in. On Windows, run `arcana-world-webui.exe` for the browser interface; "
                      "on other platforms, select WebUI in settings. The default address is http://127.0.0.1:5273.\n"
                  )
                  updates = "## What's changed"
                  compare = f"Full diff: {previous[1]} → {tag}" if previous else ""
              content = "\n\n".join(part for part in (
                  summary, download + "\n" + "\n".join(rows), start, updates + "\n\n" + changes,
                  f"[{compare}]({base}/compare/{previous[1]}...{tag})" if previous else "",
              ) if part)
              sections.append(content)
          notes = sections[0] + "\n\n<details>\n<summary>English</summary>\n\n" + sections[1] + "\n\n</details>\n"
          Path("release-notes.txt").write_text(notes, encoding="utf-8")
          PY
      - name: Generate checksums
        working-directory: dist
        run: sha256sum -- *.tar.xz *.zip > checksums.txt
      - name: Attest release artifacts
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: dist/*
      - name: Prepare draft GitHub Release
        shell: bash
        run: |
          gh release create "$RELEASE_TAG" --verify-tag --notes-file release-notes.txt \
            --title "Arcana World $RELEASE_TAG" --draft dist/*
