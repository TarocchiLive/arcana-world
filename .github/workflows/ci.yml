name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '23 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    if: github.event_name != 'schedule'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            suffix: ''
          - os: macos-latest
            suffix: ''
          - os: windows-latest
            suffix: .exe
          - os: windows-latest
            goarch: '386'
            suffix: .exe
    runs-on: ${{ matrix.os }}
    env:
      GOARCH: ${{ matrix.goarch }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Check core
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == Linux ]]; then
            make check
          else
            CGO_ENABLED=0 go test ./...
          fi
      - name: Install Wayland drawing and audio dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwayland-dev libpango1.0-dev libcairo2-dev libasound2-dev pkg-config
      - name: Build desktop bundle
        shell: bash
        run: bash scripts/build.sh desktop
      - name: Check native helper packages without device access
        shell: bash
        run: |
          audio_cgo=0
          overlay_cgo=1
          overlay_tags=
          case "$RUNNER_OS" in
            Linux) audio_cgo=1; overlay_tags=wayland ;;
            Windows) overlay_cgo=0 ;;
          esac
          CGO_ENABLED="$audio_cgo" go test -tags tts_audio ./internal/tts/audio ./cmd/arcana-world-tts
          CGO_ENABLED="$overlay_cgo" go test -tags "$overlay_tags" ./internal/overlay/...
      - name: Check command help
        shell: bash
        run: |
          "./bin/arcana-world${{ matrix.suffix }}" -help
          "./bin/libexec/arcana-world-overlay${{ matrix.suffix }}" -help
          "./bin/libexec/arcana-world-tts${{ matrix.suffix }}" -help
      - uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ runner.os }}-${{ matrix.goarch || runner.arch }}
          path: bin/

  vulnerabilities:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Install native dependencies
        run: sudo apt-get update && sudo apt-get install -y libwayland-dev libpango1.0-dev libcairo2-dev libasound2-dev pkg-config
      - name: Install vulnerability scanner
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
      - name: Scan standalone TUI and core
        run: CGO_ENABLED=0 govulncheck ./...
      - name: Scan native desktop and speech code
        run: CGO_ENABLED=1 govulncheck -tags=wayland,tts_audio ./...
